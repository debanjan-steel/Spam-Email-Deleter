services:
  - type: web
    name: gmail-spam-deleter
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/web/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0

